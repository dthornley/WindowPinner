<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="1" stop-color="#101828"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8177"/>
      <stop offset="1" stop-color="#d21f13"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef0f4"/>
      <stop offset="0.5" stop-color="#a9afb9"/>
      <stop offset="1" stop-color="#787d85"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <!-- window layout: one large + two stacked -->
  <rect x="216" y="312" width="360" height="416" rx="26" fill="#000c1f" opacity="0.5" filter="url(#soft)" transform="translate(0,14)"/>
  <rect x="216" y="312" width="360" height="416" rx="26" fill="#ffffff"/>
  <circle cx="262" cy="360" r="13" fill="#ff5f57"/>
  <circle cx="304" cy="360" r="13" fill="#febc2e"/>
  <circle cx="346" cy="360" r="13" fill="#28c840"/>
  <rect x="256" y="416" width="280" height="24" rx="12" fill="#dde3ec"/>
  <rect x="256" y="466" width="212" height="24" rx="12" fill="#dde3ec"/>
  <rect x="256" y="516" width="248" height="24" rx="12" fill="#e8ecf3"/>

  <rect x="612" y="312" width="196" height="192" rx="24" fill="#000c1f" opacity="0.5" filter="url(#soft)" transform="translate(0,12)"/>
  <rect x="612" y="312" width="196" height="192" rx="24" fill="#ffffff" opacity="0.92"/>
  <rect x="648" y="368" width="124" height="20" rx="10" fill="#dde3ec"/>
  <rect x="648" y="412" width="92" height="20" rx="10" fill="#e8ecf3"/>

  <rect x="612" y="536" width="196" height="192" rx="24" fill="#000c1f" opacity="0.5" filter="url(#soft)" transform="translate(0,12)"/>
  <rect x="612" y="536" width="196" height="192" rx="24" fill="#ffffff" opacity="0.92"/>
  <rect x="648" y="592" width="124" height="20" rx="10" fill="#dde3ec"/>
  <rect x="648" y="636" width="92" height="20" rx="10" fill="#e8ecf3"/>

  <!-- pushpin on the large window -->
  <ellipse cx="500" cy="368" rx="104" ry="42" fill="#000c1f" opacity="0.45" filter="url(#soft)"/>
  <g transform="translate(520,300) rotate(38) scale(1.12)">
    <path d="M -11 88 L 11 88 L 0 208 Z" fill="#8d939d"/>
    <path d="M 0 88 L 11 88 L 0 208 Z" fill="#6d727b"/>
    <rect x="-19" y="56" width="38" height="38" rx="9" fill="url(#metal)"/>
    <ellipse cx="0" cy="52" rx="50" ry="18" fill="#a81408"/>
    <circle cx="0" cy="-14" r="82" fill="url(#head)"/>
    <ellipse cx="-28" cy="-44" rx="26" ry="18" fill="#ffffff" opacity="0.55" transform="rotate(-30 -28 -44)"/>
  </g>
</svg>
